{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <h3 class="mb-3">No se pudo abrir la imagen</h3>
                    <p class="text-muted mb-2">{{ message }}</p>
                    {% if inventory_count %}
                    <p class="small text-muted mb-0">Registro #{{ inventory_count.id }}</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
